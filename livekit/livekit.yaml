port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Use the explicit host IP supplied by --node-ip, including for LAN testing.
  use_external_ip: false

room:
  auto_create: true

logging:
  level: info

# API credentials are supplied via LIVEKIT_KEYS in Docker Compose.
# This single-node development setup does not require Redis.
